name: Release

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - apps/idp-server/package.json
      - packages/server-core/package.json
  workflow_dispatch:
    inputs:
      resume_tag:
        description: Existing release tag to reconcile, for example v2.0.0
        required: false
        type: string
      bootstrap_confirmation:
        description: 'First npm publish only: type publish @x-oidc/server-core@<version>'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-x-oidc
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect release state
    runs-on: ubuntu-latest
    outputs:
      packageName: ${{ steps.state.outputs.packageName }}
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
      prerelease: ${{ steps.state.outputs.prerelease }}
      currentChannelVersion: ${{ steps.state.outputs.currentChannelVersion }}
      advanceChannel: ${{ steps.state.outputs.advanceChannel }}
      publishDistTag: ${{ steps.state.outputs.publishDistTag }}
      dockerChannel: ${{ steps.state.outputs.dockerChannel }}
      sourceSha: ${{ steps.state.outputs.sourceSha }}
      tagExists: ${{ steps.state.outputs.tagExists }}
      packageExists: ${{ steps.state.outputs.packageExists }}
      npmPublished: ${{ steps.state.outputs.npmPublished }}
      bootstrapMode: ${{ steps.state.outputs.bootstrapMode }}
      bootstrapRequired: ${{ steps.state.outputs.bootstrapRequired }}
      shouldRelease: ${{ steps.state.outputs.shouldRelease }}
    steps:
      - name: Checkout pushed commit
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout recovery tag
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_confirmation == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.resume_tag }}
          fetch-depth: 0

      - name: Checkout bootstrap source
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_confirmation != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Inspect package, tag, and npm registry
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESUME_TAG: ${{ inputs.resume_tag }}
          BOOTSTRAP_CONFIRMATION: ${{ inputs.bootstrap_confirmation }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
        run: |
          package_name=$(node -p "JSON.parse(require('fs').readFileSync('packages/server-core/package.json')).name")
          version=$(node -p "JSON.parse(require('fs').readFileSync('packages/server-core/package.json')).version")
          tag="v$version"
          source_sha=$(git rev-parse HEAD)
          bootstrap_requested=false
          if [ -n "$BOOTSTRAP_CONFIRMATION" ]; then
            bootstrap_requested=true
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            git fetch origin main --tags
            git merge-base --is-ancestor "$source_sha" origin/main
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$bootstrap_requested" = "true" ]; then
              if [ -n "$RESUME_TAG" ]; then
                echo "Bootstrap and resume_tag cannot be used together." >&2
                exit 1
              fi
              if [ "$WORKFLOW_REF_TYPE" != "branch" ] || [ "$WORKFLOW_REF_NAME" != "main" ]; then
                echo "npm bootstrap must be dispatched from the main branch." >&2
                exit 1
              fi
              git fetch origin main --tags
              main_sha=$(git rev-parse origin/main)
              if [ "$WORKFLOW_SHA" != "$source_sha" ] || [ "$source_sha" != "$main_sha" ]; then
                echo "Bootstrap source must equal the current main HEAD $main_sha." >&2
                exit 1
              fi
            else
              if [ -z "$RESUME_TAG" ]; then
                echo "Manual releases require resume_tag or bootstrap_confirmation." >&2
                exit 1
              fi
              if [ "$WORKFLOW_REF_TYPE" != "tag" ] || [ "$WORKFLOW_REF_NAME" != "$RESUME_TAG" ]; then
                echo "Recovery must be dispatched from tag ref $RESUME_TAG, not $WORKFLOW_REF_TYPE $WORKFLOW_REF_NAME." >&2
                exit 1
              fi
              if [ "$WORKFLOW_SHA" != "$source_sha" ]; then
                echo "Recovery event SHA $WORKFLOW_SHA does not match tag source $source_sha." >&2
                exit 1
              fi
            fi
          fi

          npm_versions=$(node scripts/release/npm-view.mjs "$package_name" versions '[]')
          npm_dist_tags=$(node scripts/release/npm-view.mjs "$package_name" dist-tags '{}')
          publish_metadata=$(NPM_DIST_TAGS_JSON="$npm_dist_tags" \
            node scripts/release/publish-metadata.mjs --format=github)
          printf '%s\n' "$publish_metadata" >> "$GITHUB_OUTPUT"
          current_channel_version=$(printf '%s\n' "$publish_metadata" | sed -n 's/^currentChannelVersion=//p')
          advance_channel=$(printf '%s\n' "$publish_metadata" | sed -n 's/^advanceChannel=//p')

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_exists=true
          fi

          release_mode=$(EVENT_NAME="$EVENT_NAME" \
            RESUME_TAG="$RESUME_TAG" \
            BOOTSTRAP_CONFIRMATION="$BOOTSTRAP_CONFIRMATION" \
            PACKAGE_NAME="$package_name" \
            RELEASE_VERSION="$version" \
            TAG_EXISTS="$tag_exists" \
            NPM_VERSIONS_JSON="$npm_versions" \
            node scripts/release/release-mode.mjs)
          printf '%s\n' "$release_mode" >> "$GITHUB_OUTPUT"
          package_exists=$(printf '%s\n' "$release_mode" | sed -n 's/^packageExists=//p')
          npm_published=$(printf '%s\n' "$release_mode" | sed -n 's/^npmPublished=//p')
          bootstrap_mode=$(printf '%s\n' "$release_mode" | sed -n 's/^bootstrapMode=//p')
          bootstrap_required=$(printf '%s\n' "$release_mode" | sed -n 's/^bootstrapRequired=//p')
          should_release=$(printf '%s\n' "$release_mode" | sed -n 's/^shouldRelease=//p')

          if [ "$should_release" = "true" ] && [ "$tag_exists" = "true" ]; then
            tag_sha=$(git rev-parse "$tag^{commit}")
            if [ "$tag_sha" != "$source_sha" ]; then
              echo "Immutable tag $tag points to $tag_sha instead of $source_sha" >&2
              exit 1
            fi
          fi

          {
            echo "packageName=$package_name"
            echo "sourceSha=$source_sha"
            echo "tagExists=$tag_exists"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Publish state"
            echo ""
            echo "- npm package: $package_name"
            echo "- Version: $version"
            echo "- Tag: $tag"
            echo "- Source: $source_sha"
            echo "- Tag exists: $tag_exists"
            echo "- npm package exists: $package_exists"
            echo "- npm published: $npm_published"
            echo "- Bootstrap mode: $bootstrap_mode"
            echo "- Bootstrap required: $bootstrap_required"
            echo "- Current channel version: ${current_channel_version:-none}"
            echo "- Advance floating channel: $advance_channel"
            echo "- Reconciliation required: $should_release"
          } >> "$GITHUB_STEP_SUMMARY"

  bootstrap-required:
    name: Require one-time npm bootstrap
    needs: inspect
    if: needs.inspect.outputs.bootstrapRequired == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Stop before creating an immutable tag
        env:
          PACKAGE_NAME: ${{ needs.inspect.outputs.packageName }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          echo "The npm package does not exist yet; no Git tag was created." >&2
          echo "Configure the protected release Environment and NPM_BOOTSTRAP_TOKEN, then dispatch Release from main with:" >&2
          echo "bootstrap_confirmation=publish $PACKAGE_NAME@$RELEASE_VERSION" >&2
          exit 1

  verify:
    name: Verify and pack release
    needs: inspect
    if: >-
      needs.inspect.outputs.shouldRelease == 'true' &&
      needs.inspect.outputs.bootstrapRequired != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.sourceSha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release verification
        run: pnpm release:verify

      - name: Create exact npm tarball
        run: pnpm release:pack

      - name: Upload npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ needs.inspect.outputs.tag }}
          path: artifacts/npm/
          if-no-files-found: error
          retention-days: 7

  bootstrap-npm:
    name: Bootstrap first npm package
    needs: [inspect, verify]
    if: needs.inspect.outputs.bootstrapMode == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.sourceSha }}

      - name: Setup Node.js and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org/

      - name: Install provenance-capable npm client
        run: npm install --global npm@11.5.1

      - name: Download exact npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-${{ needs.inspect.outputs.tag }}
          path: artifacts/npm

      - name: Verify tarball checksum
        working-directory: artifacts/npm
        run: sha256sum --check SHA256SUMS

      - name: Publish first npm version before creating Git tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_DIST_TAG: ${{ needs.inspect.outputs.publishDistTag }}
          PACKAGE_NAME: ${{ needs.inspect.outputs.packageName }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
          SOURCE_SHA: ${{ needs.inspect.outputs.sourceSha }}
        run: |
          git fetch --no-tags origin main
          current_main_sha=$(git rev-parse origin/main)
          if [ "$current_main_sha" != "$SOURCE_SHA" ]; then
            echo "main advanced to $current_main_sha after bootstrap approval; refusing to publish $SOURCE_SHA." >&2
            exit 1
          fi
          npm_versions=$(node scripts/release/npm-view.mjs "$PACKAGE_NAME" versions '[]')
          registry_state=$(NPM_VERSIONS_JSON="$npm_versions" RELEASE_VERSION="$RELEASE_VERSION" \
            node --input-type=module -e '
              import { resolveNpmRegistryState } from "./scripts/release/release-mode.mjs";
              process.stdout.write(resolveNpmRegistryState(
                JSON.parse(process.env.NPM_VERSIONS_JSON),
                process.env.RELEASE_VERSION,
              ));
            ')
          if [ "$registry_state" = "version-exists" ]; then
            echo "$PACKAGE_NAME@$RELEASE_VERSION already exists; verifying its integrity instead of publishing again."
            exit 0
          fi
          if [ "$registry_state" = "package-exists" ]; then
            echo "$PACKAGE_NAME now exists; configure Trusted Publisher instead of reusing the bootstrap Token." >&2
            exit 1
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "release Environment secret NPM_BOOTSTRAP_TOKEN is required." >&2
            exit 1
          fi
          tarball=$(find artifacts/npm -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$tarball"
          npm publish "$tarball" --access public --tag "$NPM_DIST_TAG"

      - name: Verify bootstrap package integrity in npm registry
        env:
          PACKAGE_NAME: ${{ needs.inspect.outputs.packageName }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          tarball=$(find artifacts/npm -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$tarball"
          local_integrity=$(TARBALL="$tarball" node --input-type=module -e '
            const { createHash } = await import("node:crypto");
            const { readFileSync } = await import("node:fs");
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.env.TARBALL)).digest("base64")}`);
          ')
          remote_integrity=""
          for attempt in 1 2 3 4 5 6; do
            if remote_integrity=$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" dist.integrity --json --registry=https://registry.npmjs.org/ 2>/dev/null | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk).on("end",()=>process.stdout.write(JSON.parse(data)))'); then
              if [ "$local_integrity" = "$remote_integrity" ]; then
                break
              fi
            fi
            remote_integrity=""
            sleep "$((attempt * 2))"
          done
          test -n "$remote_integrity"
          test "$local_integrity" = "$remote_integrity"

  tag:
    name: Create immutable Git tag
    needs: [inspect, verify, bootstrap-npm]
    if: >-
      always() &&
      needs.inspect.outputs.shouldRelease == 'true' &&
      needs.inspect.outputs.bootstrapRequired != 'true' &&
      needs.verify.result == 'success' &&
      (needs.bootstrap-npm.result == 'success' || needs.bootstrap-npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.sourceSha }}
          fetch-depth: 0

      - name: Create and push tag
        if: needs.inspect.outputs.tagExists != 'true'
        env:
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
          SOURCE_SHA: ${{ needs.inspect.outputs.sourceSha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$SOURCE_SHA" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Confirm existing tag
        if: needs.inspect.outputs.tagExists == 'true'
        run: echo "Tag ${{ needs.inspect.outputs.tag }} already points to the verified source commit."

  npm:
    name: Publish npm package
    needs: [inspect, verify, tag]
    if: needs.inspect.outputs.shouldRelease == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.sourceSha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.5.1

      - name: Download exact npm tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-${{ needs.inspect.outputs.tag }}
          path: artifacts/npm

      - name: Verify tarball checksum
        working-directory: artifacts/npm
        run: sha256sum --check SHA256SUMS

      - name: Publish with npm Trusted Publishing
        if: needs.inspect.outputs.npmPublished != 'true' && needs.inspect.outputs.bootstrapMode != 'true'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_DIST_TAG: ${{ needs.inspect.outputs.publishDistTag }}
          PACKAGE_NAME: ${{ needs.inspect.outputs.packageName }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          tarball=$(find artifacts/npm -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$tarball"
          npm_versions=$(node scripts/release/npm-view.mjs "$PACKAGE_NAME" versions '[]')
          registry_state=$(NPM_VERSIONS_JSON="$npm_versions" RELEASE_VERSION="$RELEASE_VERSION" \
            node --input-type=module -e '
              import { resolveNpmRegistryState } from "./scripts/release/release-mode.mjs";
              process.stdout.write(resolveNpmRegistryState(
                JSON.parse(process.env.NPM_VERSIONS_JSON),
                process.env.RELEASE_VERSION,
              ));
            ')
          if [ "$registry_state" = "version-exists" ]; then
            echo "$PACKAGE_NAME@$RELEASE_VERSION already exists; skipping duplicate publish and verifying its tarball next."
            exit 0
          fi
          if [ "$registry_state" = "package-missing" ]; then
            echo "$PACKAGE_NAME disappeared after release inspection; refusing to recreate it in the normal publish path." >&2
            exit 1
          fi
          npm publish "$tarball" --access public --tag "$NPM_DIST_TAG"

      - name: Verify npm package integrity
        env:
          PACKAGE_NAME: ${{ needs.inspect.outputs.packageName }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          tarball=$(find artifacts/npm -maxdepth 1 -name '*.tgz' -type f -print -quit)
          test -n "$tarball"
          local_integrity=$(TARBALL="$tarball" node --input-type=module -e '
            const { createHash } = await import("node:crypto");
            const { readFileSync } = await import("node:fs");
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.env.TARBALL)).digest("base64")}`);
          ')
          remote_integrity=""
          for attempt in 1 2 3 4 5 6; do
            if remote_integrity=$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" dist.integrity --json --registry=https://registry.npmjs.org/ 2>/dev/null | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk).on("end",()=>process.stdout.write(JSON.parse(data)))'); then
              if [ "$local_integrity" = "$remote_integrity" ]; then
                break
              fi
            fi
            remote_integrity=""
            sleep "$((attempt * 2))"
          done
          test -n "$remote_integrity"
          test "$local_integrity" = "$remote_integrity"

  docker:
    name: Publish Docker images
    needs: [inspect, npm]
    if: needs.inspect.outputs.shouldRelease == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
      SOURCE_SHA: ${{ needs.inspect.outputs.sourceSha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.tag }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Detect immutable image targets
        id: targets
        run: |
          tags=()
          registries=("ghcr.io/lydanne/x-oidc")
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            registries+=("${DOCKERHUB_USERNAME,,}/x-oidc")
          fi

          for image in "${registries[@]}"; do
            ref="$image:$RELEASE_VERSION"
            manifest_file=$(mktemp)
            error_file=$(mktemp)
            inspect_ok=false
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect --raw "$ref" >"$manifest_file" 2>"$error_file"; then
                inspect_ok=true
                break
              fi
              sleep "$((attempt * 2))"
            done

            if [ "$inspect_ok" = "true" ]; then
              MANIFEST_FILE="$manifest_file" node --input-type=module -e '
                const { readFileSync } = await import("node:fs");
                const manifest = JSON.parse(readFileSync(process.env.MANIFEST_FILE, "utf8"));
                const platforms = new Set(
                  (manifest.manifests ?? []).map(({ platform }) => `${platform?.os}/${platform?.architecture}`),
                );
                for (const required of ["linux/amd64", "linux/arm64"]) {
                  if (!platforms.has(required)) throw new Error(`Immutable image is missing ${required}`);
                }
              '

              for platform in linux/amd64 linux/arm64; do
                docker pull --quiet --platform "$platform" "$ref" >/dev/null
                revision=$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
                if [ "$revision" != "$SOURCE_SHA" ]; then
                  echo "Immutable image $ref ($platform) belongs to revision $revision" >&2
                  exit 1
                fi
              done
            elif grep -Eiq 'manifest unknown|name unknown|not found|(^|[^0-9])404([^0-9]|$)' "$error_file"; then
              tags+=("$ref")
            else
              echo "Unable to verify immutable image $ref; refusing to treat it as missing." >&2
              sed -n '1,20p' "$error_file" >&2
              exit 1
            fi
            rm -f "$manifest_file" "$error_file"
          done

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
            echo "registries<<EOF"
            printf '%s\n' "${registries[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "${#tags[@]}" -gt 0 ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lydanne/x-oidc
          flavor: latest=false
          tags: type=raw,value=${{ needs.inspect.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.inspect.outputs.version }}
            org.opencontainers.image.revision=${{ needs.inspect.outputs.sourceSha }}
            org.opencontainers.image.source=https://github.com/Lydanne/gitea-oidc

      - name: Build and push missing exact tags
        if: steps.targets.outputs.missing == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.targets.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ needs.inspect.outputs.version }}
            REVISION=${{ needs.inspect.outputs.sourceSha }}
            SOURCE=https://github.com/Lydanne/gitea-oidc
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Update channel aliases from immutable tags
        if: needs.inspect.outputs.advanceChannel == 'true'
        env:
          IMAGE_REGISTRIES: ${{ steps.targets.outputs.registries }}
          PRERELEASE: ${{ needs.inspect.outputs.prerelease }}
          DOCKER_CHANNEL: ${{ needs.inspect.outputs.dockerChannel }}
        run: |
          core_version=${RELEASE_VERSION%%-*}
          IFS=. read -r major minor _patch <<< "$core_version"

          if [ "$PRERELEASE" = "true" ]; then
            aliases=("$DOCKER_CHANNEL")
          else
            aliases=("$major.$minor" latest)
            if [ "$major" != "0" ]; then
              aliases+=("$major")
            fi
          fi

          while IFS= read -r image; do
            [ -n "$image" ] || continue
            for alias in "${aliases[@]}"; do
              docker buildx imagetools create \
                --tag "$image:$alias" \
                "$image:$RELEASE_VERSION"
            done
          done <<< "$IMAGE_REGISTRIES"

  github-release:
    name: Create GitHub release
    needs: [inspect, docker]
    if: needs.inspect.outputs.shouldRelease == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
          PRERELEASE: ${{ needs.inspect.outputs.prerelease }}
          ADVANCE_CHANNEL: ${{ needs.inspect.outputs.advanceChannel }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
            test "$actual" = "$PRERELEASE"
            exit 0
          fi

          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          elif [ "$ADVANCE_CHANNEL" = "true" ]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
